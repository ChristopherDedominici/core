name: Unit Tests

on: [push]

jobs:
  test_hardhat_unit:
    name: Hardhat
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Common setup
        uses: ./.github/workflows/setup

      - name: Run unit tests
        run: yarn test

  test_solidity_fuzzing:
    name: Solidity / Fuzzing & Invariants
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Common setup
        uses: ./.github/workflows/setup

      - name: Run fuzzing and invariant tests
        run: yarn hardhat test solidity -vvvvv
